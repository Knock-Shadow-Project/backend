name: knockshadow-pi

services:
    pi-service:
        image: loseardes77/knockshadow-pi-service:latest
        build:
            context: .
            dockerfile: Dockerfile.pi-service
        container_name: knockshadow-pi-service
        restart: unless-stopped
        environment:
            DB_PATH: /data/pi_data.db
            PORT: "8080"
            DEVICE_MAC_1: ${DEVICE_MAC_1:-DF:65:81:D0:D7:E5}
            DEVICE_MAC_2: ${DEVICE_MAC_2:-CB:01:10:3E:0D:61}
            API_BASE_URL: ${API_BASE_URL:-https://api.knockshadow.site}
            MDNS_HOSTNAME: ${MDNS_HOSTNAME:-knockshadow-pi}
            RUST_LOG: ${RUST_LOG:-info}
        volumes:
            - pi-data:/data
            - /var/run/dbus:/var/run/dbus:ro
            - /dev/bus/usb:/dev/bus/usb
        privileged: true
        cap_add:
            - NET_ADMIN
        # Host networking is recommended on the Raspberry Pi so that mDNS
        # broadcasts are visible on the local WiFi network.
        network_mode: host
        # El broker MQTT debe existir para reenviar golpes al WebSocket.
        # `depends_on` garantiza que `up -d pi-service` también levante nanomq
        # (si no, nombrar servicios sueltos deja el broker sin arrancar y las
        # publicaciones se pierden silenciosamente).
        depends_on:
            - nanomq

    pi-inference:
        image: loseardes77/knockshadow-pi-inference:latest
        build:
            context: .
            dockerfile: Dockerfile.pi-inference
        container_name: knockshadow-pi-inference
        restart: unless-stopped
        # Host networking so pi-inference can reach nanomq on localhost:1883.
        network_mode: host
        depends_on:
            - nanomq
        environment:
            DB_PATH: /data/pi_data.db
            # Same source of truth as pi-service / ml-app: DEVICE_MAC_*.
            SENSOR_MAC_1: ${DEVICE_MAC_1:-DF:65:81:D0:D7:E5}
            SENSOR_MAC_2: ${DEVICE_MAC_2:-CB:01:10:3E:0D:61}
            MQTT_HOST: ${MQTT_HOST:-127.0.0.1}
            MQTT_PORT: ${MQTT_PORT:-1883}
        volumes:
            - pi-data:/data
            - ./ml/model:/app/model
        command:
            - python
            - pi_inference.py
            - --user-id
            - "${USER_ID:-1}"

    ml-app:
        build:
            context: ./ml
            dockerfile: Dockerfile.ml-app
        container_name: knockshadow-ml-app
        restart: unless-stopped
        environment:
            DB_PATH: /data/pi_data.db
            SENSOR_MAC_1: ${DEVICE_MAC_1:-DF:65:81:D0:D7:E5}
            SENSOR_MAC_2: ${DEVICE_MAC_2:-CB:01:10:3E:0D:61}
        volumes:
            - pi-data:/data
            - ./ml/data:/app/data
            - ./ml/model:/app/model
        ports:
            - "8501:8501"
        command:
            - streamlit
            - run
            - app.py
            - --server.port=8501
            - --server.address=0.0.0.0

    # Janitor de la base SQLite local. Borra muestras crudas (`ble_samples`)
    # más viejas que RETENTION_HOURS y trunca el WAL, para que la microSD
    # del Pi no se llene. Sin este sidecar el archivo crece sin límite
    # (pi-service inserta ~100 filas/s y nunca borra).
    # Detalles del borrado/checkpoint: ver `ml/pi_db_janitor.py`.
    pi-db-janitor:
        image: python:3.12-slim
        container_name: knockshadow-pi-db-janitor
        restart: unless-stopped
        environment:
            DB_PATH: /data/pi_data.db
            RETENTION_HOURS: "${PI_DB_RETENTION_HOURS:-1}"
            SLEEP_SECONDS: "${PI_DB_JANITOR_SLEEP:-300}"
            # Tope de filas a borrar por pasada. El default (2M) limita
            # cada pasada a ~40 s; subirlo a 20M+ acelera el drenaje
            # inicial cuando la DB ya está saturada (millones de filas
            # atrasadas). En estado estable se borran ~60k/pasada y el
            # tope nunca se alcanza.
            MAX_ROWS_PER_PASS: "${PI_DB_MAX_ROWS_PER_PASS:-2000000}"
            # Por defecto NO vaciamos en cada arranque: VACUUM toma lock
            # exclusivo y bloquea a pi-service. Para reclamar espacio
            # acumulado (ej. tras desplegar este sidecar por primera vez),
            # arrancar puntualmente con PI_DB_VACUUM_ON_START=1.
            VACUUM_ON_START: "${PI_DB_VACUUM_ON_START:-0}"
        volumes:
            - pi-data:/data
            # Script montado :ro para que cambios en el repo se apliquen al
            # reiniciar el contenedor, sin rebuild de imagen propia.
            - ./ml/pi_db_janitor.py:/app/pi_db_janitor.py:ro
        # `-u` desactiva el buffering de stdout/stderr: `docker logs`
        # muestra los eventos del janitor en tiempo real.
        command: ["python", "-u", "/app/pi_db_janitor.py"]

    nanomq:
        image: emqx/nanomq:0.22-slim
        container_name: knockshadow-nanomq
        restart: unless-stopped
        network_mode: host
        environment:
            NANOMQ_BROKER_URL: "nmq-tcp://0.0.0.0:1883"

volumes:
    pi-data:
