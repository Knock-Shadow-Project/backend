[package]
name = "api-db"
version.workspace = true
edition.workspace = true


[profile.release]
opt-level = 3
codegen-units = 1
lto = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
# axum-prometheus añade middleware HTTP automático (latencia, status, requests).
# Lo elegimos sobre prometheus-axum-middleware porque expone los mismos
# nombres que la convención RED (Rate/Errors/Duration) y trae registry built-in
# sin necesitar configurar `prometheus::Registry` a mano.
axum-prometheus = "0.10"
bcrypt = "0.17"
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "bigdecimal"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
