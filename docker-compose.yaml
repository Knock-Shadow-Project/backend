services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: knockshadow
      POSTGRES_PASSWORD: knockshadow
      POSTGRES_DB: knockshadow
    ports:
      - "5432:5432"
    volumes:
      - db_data_pg18:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
  grafana:
    image: grafana/grafana:latest
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 100ms
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
  
  device_1:
    build: .
    depends_on:
      - db
    network_mode: host
    privileged: true
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: "unix:path=/run/dbus/system_bus_socket"
      DEVICE_MAC: "DF:65:81:D0:D7:E5"
      DATABASE_URL: "postgres://knockshadow:knockshadow@127.0.0.1:5432/knockshadow"
volumes:
  db_data_pg18: