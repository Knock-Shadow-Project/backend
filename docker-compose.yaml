name: knockshadow-cloud

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: knockshadow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: knockshadow
      POSTGRES_PASSWORD: knockshadow
      POSTGRES_DB: knockshadow
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knockshadow -d knockshadow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-db:
    build:
      context: .
      dockerfile: Dockerfile.api-db
    container_name: knockshadow-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://knockshadow:knockshadow@db:5432/knockshadow
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-knockshadow_default_secret_change_me}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  ml-app:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: knockshadow-ml-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://knockshadow:knockshadow@db:5432/knockshadow
    command:
      - streamlit
      - run
      - app.py
      - --server.port=8501
      - --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - db

volumes:
  db-data:
