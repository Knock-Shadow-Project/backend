name: knockshadow-cloud

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: knockshadow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: knockshadow
      POSTGRES_PASSWORD: knockshadow
      POSTGRES_DB: knockshadow
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knockshadow -d knockshadow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Valkey — fork BSD-3 de Redis. Lo usa `api-db` como backend del
  # rate-limit distribuido cuando se define `REDIS_URL`. Sin esta env
  # var en api-db, el rate-limit cae a memoria y este servicio queda
  # sin uso, pero no estorba.
  valkey:
    image: valkey/valkey:8-alpine
    container_name: knockshadow-valkey
    restart: unless-stopped
    # `--save ""` desactiva los snapshots a disco — el rate-limit es
    # ephemeral, no nos importa perderlo en un reinicio. Si más adelante
    # usamos Valkey para cosas con persistencia (cache, sesiones, etc.)
    # quitar esto y montar un volumen.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-db:
    build:
      context: .
      dockerfile: Dockerfile.api-db
    container_name: knockshadow-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://knockshadow:knockshadow@db:5432/knockshadow
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-knockshadow_default_secret_change_me}
      # Resend — envío real de emails transaccionales. Si no se define
      # `RESEND_API_KEY` el servidor arranca igual pero cae al modo stub
      # (loggea los enlaces de confirmación en vez de mandarlos).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-KnockShadow <no-reply@knockshadow.site>}
      APP_BASE_URL: ${APP_BASE_URL:-https://api.knockshadow.site}
      # Rate-limit distribuido vía Valkey. Si la dejas vacía, api-db
      # arranca usando el backend in-memory (1 pod) y este `valkey`
      # queda corriendo sin tráfico — útil en dev local con un solo
      # contenedor.
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379/}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  ml-app:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: knockshadow-ml-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://knockshadow:knockshadow@db:5432/knockshadow
    command:
      - streamlit
      - run
      - app.py
      - --server.port=8501
      - --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - db

  # ---------- Observability (Phase C.4) -----------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: knockshadow-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 días por defecto — basta para investigar incidentes pasados sin
      # consumir disco innecesariamente. Subir si añadimos SLO reporting.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    depends_on:
      - api-db

  grafana:
    image: grafana/grafana:11.4.0
    container_name: knockshadow-grafana
    restart: unless-stopped
    environment:
      # Login admin/admin para desarrollo local. En cualquier despliegue
      # real reemplazar por una password generada y rotada (Vault, Doppler).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - db

volumes:
  db-data:
  prometheus-data:
  grafana-data:
