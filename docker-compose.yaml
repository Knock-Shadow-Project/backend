name: knockshadow-cloud

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: knockshadow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: knockshadow
      POSTGRES_PASSWORD: knockshadow
      POSTGRES_DB: knockshadow
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knockshadow -d knockshadow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-db:
    build:
      context: .
      dockerfile: Dockerfile.api-db
    container_name: knockshadow-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://knockshadow:knockshadow@db:5432/knockshadow
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-knockshadow_default_secret_change_me}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  ble-stream:
    build:
      context: .
      dockerfile: Dockerfile.ble-stream
    container_name: knockshadow-ble
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://knockshadow:knockshadow@db:5432/knockshadow
      DEVICE_MAC: ${DEVICE_MAC:-DF:65:81:D0:D7:E5}
    depends_on:
      db:
        condition: service_healthy
    # Bluetooth requires privileged mode and access to the host D-Bus socket.
    privileged: true
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
      - /dev/bus/usb:/dev/bus/usb
    cap_add:
      - NET_ADMIN
    # If your BlueZ setup requires host networking, uncomment the next line.
    # In that case change DATABASE_URL to point to the host IP.
    # network_mode: host

  ml-inference:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: knockshadow-ml-inference
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://knockshadow:knockshadow@db:5432/knockshadow
      API_BASE_URL: http://api-db:3000
      WS_URL: ws://api-db:3000/ws
    command:
      - python
      - main.py
      - --api
      - --ws
      - --api-user-id=1
    depends_on:
      - api-db
      - db

  ml-app:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: knockshadow-ml-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://knockshadow:knockshadow@db:5432/knockshadow
    command:
      - streamlit
      - run
      - app.py
      - --server.port=8501
      - --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - db

volumes:
  db-data:
