[workspace]
resolver ="3"
members =  ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Victor Galan", "Cristian Davila"]

[workspace.dependencies]
futures = "0.3.32"
tokio = { version = "1.52.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio-postgres = "0.7.17"