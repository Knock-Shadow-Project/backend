[package]
name = "backend"
version = "0.1.0"
edition = "2024"
default-run = "ble_stream"

[[bin]]
name = "ble_stream"
path = "src/main.rs"


[profile.release]
opt-level = 3
codegen-units = 1
lto = true

[dependencies]
btleplug = "0.12.0"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
tokio = { version = "1.52.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio-postgres = "0.7.17"